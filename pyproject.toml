[project]
name = "doclens"
version = "0.1.0"
description = "OCR e busca semântica em documentos administrativos em português"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.142.2,<1",
  "starlette>=1.7,<2",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.32",
  "pillow>=12.3",
  "numpy>=2,<3",
  "opencv-python-headless>=4.11,<5",
  "pypdfium2>=4.30,<6",
  "easyocr==1.7.2",
  "sentence-transformers>=5,<6",
  "scikit-learn>=1.6,<2",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "truststore>=0.10,<1",
  "snowballstemmer>=3,<4",
  "pyspellchecker==0.9.0",
  "streamlit>=1.65,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pypdf>=6,<8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: testes com modelos reais previamente baixados"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

